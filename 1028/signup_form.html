<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>會員註冊</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light py-4">
  <div class="container" style="max-width: 560px;">
    <h2 class="mb-3">建立會員帳號</h2>
    <p class="text-muted small mb-4">請完整填寫以下欄位以完成註冊。</p>

    <form id="signup-form" novalidate>
      <!-- 姓名 -->
      <div class="mb-3">
        <label class="form-label" for="fullname">姓名<span class="text-danger">*</span></label>
        <input
          id="fullname"
          name="fullname"
          class="form-control"
          type="text"
          required
        />
        <p class="text-danger small mb-0" data-error-for="fullname"></p>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label" for="email">Email<span class="text-danger">*</span></label>
        <input
          id="email"
          name="email"
          class="form-control"
          type="email"
          required
          inputmode="email"
        />
        <p class="text-danger small mb-0" data-error-for="email"></p>
      </div>

      <!-- 手機 -->
      <div class="mb-3">
        <label class="form-label" for="phone">手機 (10碼數字)<span class="text-danger">*</span></label>
        <input
          id="phone"
          name="phone"
          class="form-control"
          type="tel"
          required
          inputmode="numeric"
          pattern="^[0-9]{10}$"
          maxlength="10"
        />
        <p class="text-danger small mb-0" data-error-for="phone"></p>
      </div>

      <!-- 密碼 -->
      <div class="mb-3">
        <label class="form-label" for="password">密碼 (至少8碼，英數混合)<span class="text-danger">*</span></label>
        <input
          id="password"
          name="password"
          class="form-control"
          type="password"
          required
          minlength="8"
        />
        <p class="text-danger small mb-1" data-error-for="password"></p>

        <!-- 密碼強度條 (加分) -->
        <div id="strength-bar" class="strength-bar bg-secondary small text-white rounded px-2 py-1 d-inline-block">
          強度：尚未輸入
        </div>
      </div>

      <!-- 確認密碼 -->
      <div class="mb-3">
        <label class="form-label" for="confirm-password">確認密碼<span class="text-danger">*</span></label>
        <input
          id="confirm-password"
          name="confirm-password"
          class="form-control"
          type="password"
          required
        />
        <p class="text-danger small mb-0" data-error-for="confirm-password"></p>
      </div>

      <!-- 興趣標籤 (至少一個，要用事件委派) -->
      <div class="mb-3">
        <label class="form-label d-block">興趣標籤 <span class="text-danger">*</span></label>
        <div id="interest-group" class="d-flex flex-wrap gap-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="tag-tech" value="tech" />
            <label class="form-check-label" for="tag-tech">科技</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="tag-music" value="music" />
            <label class="form-check-label" for="tag-music">音樂</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="tag-sport" value="sport" />
            <label class="form-check-label" for="tag-sport">運動</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="tag-art" value="art" />
            <label class="form-check-label" for="tag-art">藝術</label>
          </div>
        </div>
        <p class="text-danger small mb-0" data-error-for="interest-group"></p>
      </div>

      <!-- 服務條款 -->
      <div class="mb-4">
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="terms"
            required
          />
          <label class="form-check-label" for="terms">
            我已閱讀並同意服務條款 <span class="text-danger">*</span>
          </label>
        </div>
        <p class="text-danger small mb-0" data-error-for="terms"></p>
      </div>

      <!-- 操作按鈕 -->
      <div class="d-flex gap-2">
        <button id="submit-btn" class="btn btn-primary" type="submit">送出</button>
        <button id="reset-btn" class="btn btn-outline-secondary" type="button">重設</button>
      </div>
    </form>
  </div>

  <script src="signup_form.js"></script>
</body>
</html>
